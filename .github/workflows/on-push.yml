name: on-push

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - uses: pre-commit/action@v3.0.1

  combine-environments:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - name: Install conda-merge
      run: |
        python -m pip install conda-merge
    - name: Combine environments
      run: |
        conda-merge ci/environment-ci.yml environment.yml > ci/combined-environment-ci.yml
    - uses: actions/upload-artifact@v4
      with:
        name: combined-environments
        path: ci/combined-environment-*.yml

  unit-tests:
    name: unit-tests
    needs: combine-environments
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-env
    - name: Run tests
      run: |
        make unit-tests COV_REPORT=xml

  type-check:
    needs: combine-environments
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-env
    - name: Run code quality checks
      run: |
        make type-check

  verification-tests:
    name: verification-tests
    needs: combine-environments
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-env
    - name: Run upstream-physics verification tests
      run: |
        make verification-tests
    - name: Run slow tests
      run: |
        make slow-tests

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    - name: Run frontend unit tests
      working-directory: frontend
      run: npm run test:unit
    - name: Type check frontend
      working-directory: frontend
      run: npm run type-check
    - name: Build frontend
      working-directory: frontend
      run: npm run build

  docs-build:
    needs: combine-environments
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-env
    - name: Build documentation
      run: |
        make docs-build
        # create docs in html/
      # From https://github.com/marketplace/actions/sphinx-build
    - uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build/html/

  # Deployment job.
  deploy:
    needs: docs-build

    # Deploy only when the main branch is pushed.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment.
    permissions:
      contents: read
      pages: write # To deploy to Pages.
      id-token: write # To verify the deployment originates from an appropriate source.

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
